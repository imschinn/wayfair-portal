# ═══════════════════════════════════════════════════════════
# Wayfair Portal — Backend Configuration
# Copy this file to application-local.properties for local dev
# Never commit secrets to version control.
# ═══════════════════════════════════════════════════════════

spring.application.name=wayfair-portal-backend

# ── Server ──────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ── DataSource: PostgreSQL ──────────────────────────────────
# For local Docker:
spring.datasource.url=jdbc:postgresql://localhost:5432/wayfair_db
# For GCP Cloud SQL (Cloud Run / GKE) — replace PROJECT:REGION:INSTANCE
# spring.datasource.url=jdbc:postgresql:///wayfair_db?cloudSqlInstance=PROJECT:REGION:INSTANCE&socketFactory=com.google.cloud.sql.postgres.SocketFactory

spring.datasource.username=wayfair_user
spring.datasource.password=wayfair_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP defaults — tune for production)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Use 'validate' or 'none' in production — 'update' for development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Batch inserts for bulk inventory operations
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── CORS — allow Next.js frontend ───────────────────────────
frontend.url=http://localhost:3000

# ── Actuator — expose health for GCP readiness/liveness probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# ── OpenAPI / Swagger UI ─────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ──────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.wayfairportal=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
